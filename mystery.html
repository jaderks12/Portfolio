<!doctype html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="stylesforbaks.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mystery Box</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(to right, #141e30, #243b55);
        color: white;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        text-align: center;
        overflow: hidden;
      }
      h1 {
        font-size: 3rem;
        animation: fadeInDown 1s ease-out;
      }
      p {
        font-size: 1.2rem;
        max-width: 600px;
        opacity: 0;
        animation: fadeIn 2s ease-in forwards;
        animation-delay: 1s;
      }
      button {
        margin-top: 20px;
        padding: 10px 20px;
        font-size: 1rem;
        background-color: #ff4081;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        color: white;
        transition:
          background 0.3s,
          transform 0.2s;
        animation: fadeInUp 1s ease-out 1.5s forwards;
        opacity: 0;
      }
      button:hover {
        background-color: #e73370;
        transform: scale(1.05);
      }
      #fact {
        margin-top: 30px;
        font-style: italic;
        opacity: 0;
        transition: opacity 0.5s ease-in-out;
      }
      @keyframes fadeInDown {
        from {
          transform: translateY(-50px);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes fadeInUp {
        from {
          transform: translateY(50px);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <h1 onclick="showbakla()">WELCOME TO BAKLA RANDOMIZER</h1>

    <p>e click diri para mahibaw.an kinsay bakla</p>
    <button onclick="showbakla2()">open bakla 2</button>
    <button onclick="showbakla()">Open Bakla</button>
    <p id="baks">1 baks</p>
    <p id="baks2">2 baks</p>

    <div id="particles-js"></div>
    <div class="count-particles">
      <span class="js-count-particles"></span>
    </div>
    <script src="http://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script src="http://threejs.org/examples/js/libs/stats.min.js"></script>

    <script>
      const baks = [
        "kirbu",
        "fide",
        " angel",
        " jalot",
        " AJ bitbox",
        "balot",
        " baki",
        " tikal",
      ];

      function showbakla() {
        const randomIndex = Math.floor(Math.random() * baks.length);

        const baksElement = document.getElementById("baks");
        baksElement.style.opacity = 0;

        baksElement.textContent = baks[randomIndex];
        baksElement.style.opacity = 1;
        baksElement.style.scale = (1, 3);
        baksElement.style.color = "red";
        console.log("all baks", baks);
      }
      function showbakla2() {
        const randomIndex = Math.floor(Math.random() * baks.length);

        const baksElement = document.getElementById("baks2");
        baksElement.style.opacity = 0;

        baksElement.textContent = baks[randomIndex];
        baksElement.style.opacity = 1;
        baksElement.style.scale = (1, 3);
        baksElement.style.color = "red";
        console.log("all baks", baks);
      }
      particlesJS("particles-js", {
        particles: {
          number: { value: 80, density: { enable: true, value_area: 800 } },
          color: { value: "#ffffff" },
          shape: {
            type: "circle",
            stroke: { width: 0, color: "#000254" },
            polygon: { nb_sides: 5 },
            image: { src: "img/github.svg", width: 100, height: 100 },
          },
          opacity: {
            value: 0.5,
            random: false,
            anim: { enable: false, speed: 1, opacity_min: 0.1, sync: false },
          },
          size: {
            value: 3,
            random: true,
            anim: { enable: false, speed: 40, size_min: 0.1, sync: false },
          },
          line_linked: {
            enable: true,
            distance: 150,
            color: "#ffffff",
            opacity: 0.4,
            width: 1,
          },
          move: {
            enable: true,
            speed: 6,
            direction: "none",
            random: false,
            straight: false,
            out_mode: "out",
            bounce: false,
            attract: { enable: false, rotateX: 600, rotateY: 1200 },
          },
        },
        interactivity: {
          detect_on: "canvas",
          events: {
            onhover: { enable: true, mode: "repulse" },
            onclick: { enable: true, mode: "push" },
            resize: true,
          },
          modes: {
            grab: { distance: 400, line_linked: { opacity: 1 } },
            bubble: {
              distance: 400,
              size: 40,
              duration: 2,
              opacity: 8,
              speed: 3,
            },
            repulse: { distance: 200, duration: 0.4 },
            push: { particles_nb: 4 },
            remove: { particles_nb: 2 },
          },
        },
        retina_detect: true,
      });
      var count_particles, stats, update;
      stats = new Stats();
      stats.setMode(0);
      stats.domElement.style.position = "absolute";
      stats.domElement.style.left = "0px";
      stats.domElement.style.top = "0px";
      document.body.appendChild(stats.domElement);
      count_particles = document.querySelector(".js-count-particles");
      update = function () {
        stats.begin();
        stats.end();
        if (
          window.pJSDom[0].pJS.particles &&
          window.pJSDom[0].pJS.particles.array
        ) {
          count_particles.innerText =
            window.pJSDom[0].pJS.particles.array.length;
        }
        requestAnimationFrame(update);
      };
      requestAnimationFrame(update);
    </script>
  </body>
</html>
